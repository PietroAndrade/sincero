// SINCERO — the inputs of a simulation, as the API receives them.
//
// This file is the source of truth for the input fields: their names, types, defaults,
// which of them may be null, and which DTO owns each one. `tools/gen_dto.py` generates
// `app/models/input_fields.py` from it — one frozen dataclass per `Group` — and the
// hand-written DTOs in `app/models/input_dto.py` (`ContractData`, `MarketData`,
// `BankCreditData`) only add the amounts derived from their own fields.
//
//     make dto          regenerate app/models/input_fields.py (needs grpcio-tools)
//     make test         fails while the generated file and this .proto disagree
//     make proto        regenerate ../frontend/src/gen/ (TypeScript) and app/gen/ (Python) from every sincero/*.proto
//     make proto-check  fails while those and the .proto files disagree
//
// Conventions, enforced by the generator:
//
//   * `SimulationInput` is one FLAT message: the body of `POST /api/simulations` is one flat
//     object (docs/api-contract.md), and the split into three DTOs is a model concern. The
//     owner of a field is the `group` of its `(sincero.field)` option, never nesting.
//   * A plain scalar becomes a required dataclass field; on the wire it can't be told apart from
//     its zero value. Use it only when absent and zero mean the same thing (`name`).
//   * A field that must be present is `optional` + `(buf.validate.field).required = true`: a
//     required dataclass field (no default), and on the wire "absent" is refused apart from
//     "invalid" (docs/decisions/required-fields-explicit-presence.md). Never `optional` without
//     `required`, a default or `nullable`.
//   * An `optional` field that may be omitted says what omission means: a `default_*` (proto3 has
//     no custom defaults, so the option carries it) or `nullable: true` — `null` is a value,
//     "let the model size it" (`Optional[...] = None`).
//   * A `repeated` field defaults to empty and becomes a tuple.
//   * Within a group, required fields come before optional ones (a dataclass rule).
//   * Field names are unique across groups: a flat `field -> value` mapping (a JSON body,
//     argparse flags, a what-if override) is routed to its DTO by name (`FIELD_OWNER`).
//
// Units and help text stay in the controllers for now (`cli_controller.HELP`,
// `api_requests.UNITS`) — docs/api-contract.md, open question "Field help text".
syntax = "proto3";

package sincero;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

// ----- the vocabulary of this file ---------------------------------------------------

// The DTO that owns a field. One frozen dataclass `<Group>Fields` is generated per group,
// in this order; the comment of each value is the docstring of its dataclass.
enum Group {
  GROUP_UNSPECIFIED = 0;
  // The contract with the developer: the property, the down payment and how it is paid.
  CONTRACT = 1;
  // Market and regulatory conditions, independent of the property.
  MARKET = 2;
  // The bank's position at signing and the fallback when it falls short at delivery.
  BANK_CREDIT = 3;
}

// What the generator needs to know about one input field beyond its type.
message FieldMeta {
  Group group = 1;
  // Value of an omitted `optional` field. Must match the field's type.
  oneof default {
    double default_number = 2;
    int32 default_integer = 3;
    string default_string = 4;
  }
  // `null` is accepted and means "absent": the model derives the value.
  bool nullable = 5;
}

extend google.protobuf.FieldOptions {
  FieldMeta field = 50001;
}

// ----- the inputs ------------------------------------------------------------------------

// Everything a simulation needs. The request of `CreateSimulation` (the body of
// `POST /api/simulations`) and the `input` of a `SimulationResult`. A part of it — a
// candidate, a variation — is a `SimulationOverrides` (below). The other requests and the
// results: simulations_service.proto and simulation_result.proto.
message SimulationInput {
  // --- contract: what the buyer signs with the developer ---

  // Label of the property. Required by the model; the CLI and the API label an unnamed
  // simulation "CUSTOM" (docs/api-contract.md, open question "Where `name`'s default lives").
  string name = 1 [(sincero.field) = {group: CONTRACT}];
  // List price, R$.
  optional double list_price = 2 [(sincero.field) = {group: CONTRACT},
                                  (buf.validate.field).required = true,
                                  (buf.validate.field).double.gt = 0];
  // Months left until the building is delivered (time left, not the project's total duration).
  optional int32 months_remaining = 3 [(sincero.field) = {group: CONTRACT},
                                       (buf.validate.field).required = true,
                                       (buf.validate.field).int32 = {gte: 1, lte: 600}];
  // Down payment required by the developer, % of the list price.
  optional double down_payment_pct = 4 [(sincero.field) = {group: CONTRACT default_number: 20.0}];
  // FGTS used at signing, R$.
  optional double fgts_upfront = 5 [(sincero.field) = {group: CONTRACT default_number: 0.0}];
  // Cash paid at signing, R$; above the down payment it reduces the financed balance.
  optional double cash_upfront = 6 [(sincero.field) = {group: CONTRACT default_number: 0.0}];
  // Monthly amount paid to the developer during construction, R$. When null the remaining
  // down payment is split in equal installments; when the buyer chooses an amount, whatever
  // it does not cover is paid as balloons in `balloon_months` (the balloon amount is derived,
  // never typed in).
  optional double developer_installment = 7 [(sincero.field) = {group: CONTRACT nullable: true}];
  // Construction months (1..months_remaining) with a balloon payment.
  repeated int32 balloon_months = 8 [(sincero.field) = {group: CONTRACT}];

  // --- market: the economic environment ---

  // INCC, % per year.
  optional double incc_rate_pa = 9 [(sincero.field) = {group: MARKET default_number: 7.0}];
  // Bank interest rate, % per year.
  optional double bank_rate_pa = 10 [(sincero.field) = {group: MARKET default_number: 10.26}];
  // Bank financing term, months.
  optional int32 term_months = 11 [(sincero.field) = {group: MARKET default_integer: 360}];
  // ITBI, % of the list price.
  optional double itbi_pct = 12 [(sincero.field) = {group: MARKET default_number: 2.0}];
  // Registry and deed costs, % of the list price.
  optional double registry_pct = 13 [(sincero.field) = {group: MARKET default_number: 0.5}];
  // Max share of household income the bank accepts as installment, 0-1.
  optional double income_commitment_ratio = 14 [(sincero.field) = {group: MARKET default_number: 0.30}];

  // --- bank credit: the bank's position at signing ---

  // Credit pre-approved by the bank at signing, R$. When null: the nominal mortgage balance.
  optional double pre_approved_credit = 15 [(sincero.field) = {group: BANK_CREDIT nullable: true}];
  // Months to pay the developer any credit gap (pro-soluto).
  optional int32 pro_soluto_months = 16 [(sincero.field) = {group: BANK_CREDIT default_integer: 12}];
}

// ----- partial inputs --------------------------------------------------------------------

// Some fields of a `SimulationInput`: the `base` and `candidates` of a comparison, the
// `variations` of a what-if, the `overrides` of a comparison row. A field that is set replaces
// the value it is merged onto (the base's, the stored simulation's); a field that is not set
// keeps it. The service simulates the merged input, never an overrides message alone.
//
// Same names, numbers and `buf.validate` rules as `SimulationInput`, minus `required`: a part
// may leave out anything, so every field has explicit presence and is validated when set.
// Proto3 cannot tell "set to empty / null" from "not set" on a repeated or `optional` field, so:
//
//   * `balloon_months` is a `BalloonMonths`: set with no months clears the balloons;
//   * the nullable fields are a `NullableAmount`: set with no value is `null` ("let the model
//     size it"), as in `SimulationInput`.
//
// tests/test_simulation_overrides.py fails while this message and `SimulationInput` disagree.
message SimulationOverrides {
  // --- contract ---
  optional string name = 1;
  optional double list_price = 2 [(buf.validate.field).double.gt = 0];
  optional int32 months_remaining = 3 [(buf.validate.field).int32 = {gte: 1, lte: 600}];
  optional double down_payment_pct = 4;
  optional double fgts_upfront = 5;
  optional double cash_upfront = 6;
  NullableAmount developer_installment = 7;
  BalloonMonths balloon_months = 8;

  // --- market ---
  optional double incc_rate_pa = 9;
  optional double bank_rate_pa = 10;
  optional int32 term_months = 11;
  optional double itbi_pct = 12;
  optional double registry_pct = 13;
  optional double income_commitment_ratio = 14;

  // --- bank credit ---
  NullableAmount pre_approved_credit = 15;
  optional int32 pro_soluto_months = 16;
}

// The construction months with a balloon payment. Empty is a value: no balloons.
// JSON: `{"months": [6, 12]}`; `{}` clears them.
message BalloonMonths {
  repeated int32 months = 1;
}

// An amount, R$, or `null`: the model derives it. Unset `value` is `null`.
// JSON: `{"value": 2500}`; `{}` is `null`. A JSON `null` in its place is "not set" (proto3),
// i.e. "keep the value", not "set it to null".
message NullableAmount {
  optional double value = 1;
}
