  schemas:
    # >>> generated from proto/sincero/simulation_input.proto by gen_openapi.py — do not edit this block
    InputFields:
      type: object
      description: "Any subset of the input fields of a simulation — a `base`, a candidate, a variation, the `overrides` of a what-if row. Field names are the model's; the grouping into `contract` / `market` / `bank_credit` (`x-group`) is not visible on the wire. Types are strict JSON types: a number field takes only a JSON number, an integer field a JSON number without fractional part (`19.0` is fine, `19.5` is not). `null` is accepted only where the type says so and means \"absent\". Generated from `proto/sincero/simulation_input.proto`."
      additionalProperties: false
      properties:
        name:
          type: string
          description: "Label of the property. Required by the model; the CLI and the API label an unnamed simulation \"CUSTOM\" (docs/api-contract.md, open question \"Where `name`'s default lives\")."
          default: CUSTOM
          x-group: contract
        list_price:
          type: number
          description: "List price, R$."
          maximum: 1000000000000
          x-group: contract
          x-unit: "R$"
        months_remaining:
          type: integer
          description: "Months left until the building is delivered (time left, not the project's total duration)."
          maximum: 600
          x-group: contract
          x-unit: months
        down_payment_pct:
          type: number
          description: "Down payment required by the developer, % of the list price."
          default: 20.0
          maximum: 1000
          x-group: contract
          x-unit: "% of list price"
        fgts_upfront:
          type: number
          description: "FGTS used at signing, R$."
          default: 0.0
          maximum: 1000000000000
          x-group: contract
          x-unit: "R$"
        cash_upfront:
          type: number
          description: "Cash paid at signing, R$; above the down payment it reduces the financed balance."
          default: 0.0
          maximum: 1000000000000
          x-group: contract
          x-unit: "R$"
        developer_installment:
          type: [number, "null"]
          description: "Monthly amount paid to the developer during construction, R$. When null the remaining down payment is split in equal installments; when the buyer chooses an amount, whatever it does not cover is paid as balloons in `balloon_months` (the balloon amount is derived, never typed in)."
          default: null
          maximum: 1000000000000
          x-group: contract
          x-unit: "R$ per month"
        balloon_months:
          type: array
          items:
            type: integer
          maxItems: 60
          description: "Construction months (1..months_remaining) with a balloon payment."
          default: []
          x-group: contract
          x-unit: months
        incc_rate_pa:
          type: number
          description: "INCC, % per year."
          default: 7.0
          maximum: 1000
          x-group: market
          x-unit: "% per year"
        bank_rate_pa:
          type: number
          description: "Bank interest rate, % per year."
          default: 10.26
          maximum: 1000
          x-group: market
          x-unit: "% per year"
        term_months:
          type: integer
          description: "Bank financing term, months."
          default: 360
          maximum: 600
          x-group: market
          x-unit: months
        itbi_pct:
