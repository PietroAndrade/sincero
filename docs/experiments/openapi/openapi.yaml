    SimulationInput:
      description: "The body of `POST /api/simulations`: the input fields with the required ones present. Omitted fields take their `default`."
      allOf:
        - $ref: "#/components/schemas/InputFields"
      required: [list_price, months_remaining]
    # <<< end of the generated block

    ComparisonRequest:
      type: object
      description: "`POST /api/comparisons`: each candidate is `{**base, **candidate}` and must satisfy every rule of `SimulationInput` after the merge. Mirrors `sincero.ComparisonRequest` in the .proto."
      additionalProperties: false
      required: [candidates]
      properties:
        base:
          description: Input fields shared by every candidate. Optional (default `{}`); `null` is not allowed.
          $ref: "#/components/schemas/InputFields"
        candidates:
          type: array
          description: Per-candidate input fields, 1 to 20.
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/InputFields"
    WhatIfRequest:
      type: object
      description: "`POST /api/simulations/{id}/what-if`: overrides applied to the stored base. Mirrors `sincero.WhatIfRequest` in the .proto."
      additionalProperties: false
      required: [variations]
      properties:
        variations:
          type: array
          description: Sets of input-field overrides, 1 to 20, none empty.
          minItems: 1
          maxItems: 20
          items:
            allOf:
              - $ref: "#/components/schemas/InputFields"
              - minProperties: 1
    CashLadderRequest:
      type: object
      description: "`POST /api/simulations/{id}/cash-ladder`: cash at signing for each rung, absolute, in R$ — finite, non-negative, strictly increasing. Mirrors `sincero.CashLadderRequest` in the .proto."
      additionalProperties: false
      required: [amounts]
      properties:
        amounts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: number
            minimum: 0
            maximum: 1000000000000

    Created:
      type: object
      description: The answer to `POST /api/simulations` — no figures; the id is opaque.
      additionalProperties: false
      required: [id, href]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        href:
          type: string
          description: "`/api/simulations/{id}`"
    FieldSpec:
      type: object
      description: One input field as `GET /api/fields` lists it.
      additionalProperties: false
      required: [name, group, type, required, default, unit]
      properties:
        name:
          type: string
        group:
          type: string
          enum: [contract, market, bank_credit]
        type:
          type: string
          enum: [string, number, integer, "number|null", "integer[]"]
        required:
          type: boolean
        default:
          description: The value an omitted field takes; `null` for a required field and for the nullable ones.
          type: [string, number, integer, array, "null"]
        unit:
          type: [string, "null"]
    Error:
      type: object
      description: The body of every non-2xx response. Nothing else is ever in it — no stack, no exception class, no internal path.
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
          description: One human-readable sentence. For `422` it is the model's message, verbatim and contractual; for every other status it is for the developer and its wording is not contractual.
        code:
          type: string
          description: A stable `snake_case` identifier of the cause — the thing a client branches on within a status. New codes may be added; existing ones are never renamed.
          enum: [malformed_json, wrong_type, unknown_field, missing_field, null_not_allowed, not_finite, out_of_range, invalid_value, not_found, method_not_allowed, payload_too_large, unsupported_media_type, invalid_input, internal_error]
        field:
          type: string
          description: "When the error is about one key or parameter: its path from the body root (`list_price`, `balloon_months[1]`, `base.fgts`, `candidates[1].months_remaining`, `amounts[2]`) or, for a `GET`, the query parameter name (`ids`, `fields`, `relative_to`); `body` when the body itself is wrong; `path` for a bad node path."
        index:
          type: integer
          minimum: 0
          description: When the error is about one item of `candidates`, `variations` or `amounts` — its zero-based position.
        request_id:
          type: string
          description: "On `500` only: the `X-Request-Id` of the response."

    SimulationResource:
      type: object
      description: "`GET /api/simulations/{id}`: what was simulated, the headline figures, and what else can be fetched."
      additionalProperties: false
      required: [id, href, created_at, expires_at, input, summary, sections]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        href:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339, UTC.
        expires_at:
          type: string
          format: date-time
          description: RFC 3339, UTC; moves forward on every access.
        input:
          description: The resolved input — every field present, defaults filled in; `developer_installment` / `pre_approved_credit` stay `null` when omitted; `balloon_months` echoed as received.
          $ref: "#/components/schemas/ResolvedInput"
        summary:
          $ref: "#/components/schemas/Summary"
        sections:
          type: object
          description: One entry per top-level payload node plus `result`; `fields` is null for `result`.
          additionalProperties:
            $ref: "#/components/schemas/Section"
    Section:
      type: object
      additionalProperties: false
      required: [href, fields]
      properties:
        href:
          type: string
        fields:
          description: "key → kind, where kind is `number` | `string` | `null` | `object` | `array[n]` (n = number of rows), computed from the actual payload."
          type: [object, "null"]
          additionalProperties:
            type: string
            pattern: "^(number|string|null|object|array\\[[0-9]+\\])$"
    ResolvedInput:
      description: "`InputFields` with every field present — the `input` of a resource and of the payload."
      allOf:
        - $ref: "#/components/schemas/InputFields"
      required: [name, list_price, months_remaining, down_payment_pct, fgts_upfront, cash_upfront, developer_installment, balloon_months, incc_rate_pa, bank_rate_pa, term_months, itbi_pct, registry_pct, income_commitment_ratio, pre_approved_credit, pro_soluto_months]

    SummaryColumns:
      type: object
      description: The columns of `summary_to_dict`. Money in R$, not rounded; `extra_pct` is a percentage.
      properties:
        name: {type: string}
        list_price: {type: number}
        months_remaining: {type: integer}
        cash_upfront: {type: number}
        developer_installment: {type: number, description: "`down_payment.nominal_installment` — resolved, never null"}
        nominal_balloon: {type: number}
        incc_on_down_payment: {type: number, description: "`down_payment.incc_correction`"}
        hidden_incc_debt: {type: number}
        balance_at_delivery: {type: number, description: "`mortgage.corrected_balance`"}
        construction_interest: {type: number}
        closing_costs: {type: number}
        sac_first_installment: {type: number}
        sac_last_installment: {type: number}
        price_installment: {type: number}
        min_income_sac: {type: number}
        min_income_price: {type: number}
        credit_gap: {type: number}
        total_cost: {type: number}
        extra_pct: {type: number}
        peak_month: {type: integer}
        peak_total: {type: number}
    Summary:
      description: "`summary_to_dict`, whole: the flat, table-friendly figures of one simulation — the `summary` of a resource."
      allOf:
        - $ref: "#/components/schemas/SummaryColumns"
      required: [name, list_price, months_remaining, cash_upfront, developer_installment, nominal_balloon, incc_on_down_payment, hidden_incc_debt, balance_at_delivery, construction_interest, closing_costs, sac_first_installment, sac_last_installment, price_installment, min_income_sac, min_income_price, credit_gap, total_cost, extra_pct, peak_month, peak_total]
      unevaluatedProperties: false
    ComparisonRow:
      description: "One row of a comparison: the summary columns plus `id` and `href` linking the row to its simulation; with a reference, `overrides` and `delta` as the last two columns. Every column is present unless `fields` selected a subset, so none is required here."
      allOf:
        - $ref: "#/components/schemas/SummaryColumns"
        - type: object
          properties:
            id:
              type: string
              pattern: "^[0-9a-f]{32}$"
            href:
              type: string
            overrides:
              description: The input fields in which this row's resolved input differs from the reference's, with this row's values; `{}` when identical.
              $ref: "#/components/schemas/InputFields"
            delta:
              type: object
              description: "`row[column] − relative_to[column]` for every numeric summary column, in the summary's order."
              additionalProperties:
                type: number
      unevaluatedProperties: false
    Comparison:
      type: object
      description: Summary rows side by side, in the order of `ids`; with `relative_to`, a what-if.
      additionalProperties: false
      required: [href, rows]
      properties:
        href:
          type: string
          description: "`/api/comparisons?ids=…[&relative_to=…]` — always the full `ids`, never `fields`."
        relative_to:
          description: The reference simulation as a row (without `overrides` / `delta`); present only on a what-if.
          $ref: "#/components/schemas/ComparisonRow"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonRow"

    SimulationPayload:
      type: object
      description: "`simulation_to_dict`: the whole result, `GET …/result` and `python cli.py … --json`. Every number is finite; money is in R$, not rounded; rates are fractions per month."
      additionalProperties: false
      required: [input, rates, down_payment, mortgage, construction_interest, closing_costs, financing, credit_gap, total_cost, timeline]
      properties:
        input:
          $ref: "#/components/schemas/ResolvedInput"
        rates:
          $ref: "#/components/schemas/Rates"
        down_payment:
          $ref: "#/components/schemas/DownPayment"
        mortgage:
          $ref: "#/components/schemas/Mortgage"
        construction_interest:
          $ref: "#/components/schemas/ConstructionInterest"
        closing_costs:
          $ref: "#/components/schemas/ClosingCosts"
        financing:
          $ref: "#/components/schemas/Financing"
        credit_gap:
          $ref: "#/components/schemas/CreditGap"
        total_cost:
          $ref: "#/components/schemas/TotalCost"
        timeline:
          $ref: "#/components/schemas/Timeline"
    Rates:
      type: object
      description: Annual percentages of the input turned into monthly fractions by compounding, `(1 + r/100)^(1/12) − 1`.
      additionalProperties: false
      required: [incc_pm, bank_pm]
      properties:
        incc_pm: {type: number}
        bank_pm: {type: number}
    DownPayment:
      type: object
      description: What goes to the developer during construction.
      additionalProperties: false
      required: [required, upfront, remaining, nominal_installment, missing_amount, nominal_balloon, balloons, total_paid, incc_correction, schedule]
      properties:
        required: {type: number, description: "`list_price × down_payment_pct / 100`"}
        upfront: {type: number, description: "`fgts_upfront + cash_upfront`"}
        remaining: {type: number, description: "`max(0, required − upfront)`"}
        nominal_installment: {type: number, description: "monthly installment before INCC: the one given, or `remaining / N`"}
        missing_amount: {type: number, description: "`remaining − nominal_installment × N`, the part paid as balloons (nominal); 0 without balloons"}
        nominal_balloon: {type: number, description: "one balloon before INCC; 0 without balloons"}
        balloons:
          type: array
          description: The derived balloons, sorted by month; empty whenever `developer_installment` is null.
          items:
            $ref: "#/components/schemas/Balloon"
        total_paid: {type: number, description: sum of every INCC-corrected payment in `schedule`}
        incc_correction: {type: number, description: "`total_paid − remaining`"}
        schedule:
          type: array
          description: One row per construction month `1..N`.
          items:
            $ref: "#/components/schemas/DownPaymentRow"
    Balloon:
      type: object
      additionalProperties: false
      required: [month, nominal]
      properties:
        month: {type: integer}
        nominal: {type: number}
    DownPaymentRow:
      type: object
      additionalProperties: false
      required: [month, incc_factor, installment, balloon]
      properties:
        month: {type: integer}
        incc_factor: {type: number, description: "`(1 + incc_pm)^month`"}
        installment: {type: number, description: INCC-corrected}
        balloon: {type: number, description: INCC-corrected; 0 in a month without a balloon}
    Mortgage:
      type: object
      description: The balance handed to the bank.
      additionalProperties: false
      required: [nominal_balance, corrected_balance, hidden_incc_debt]
      properties:
        nominal_balance: {type: number, description: "`list_price − max(required, upfront)`"}
        corrected_balance: {type: number, description: "`nominal_balance × (1 + incc_pm)^N` — what the bank must finance at delivery"}
        hidden_incc_debt: {type: number, description: "`corrected_balance − nominal_balance`"}
    ConstructionInterest:
      type: object
      additionalProperties: false
      required: [total, schedule]
      properties:
        total: {type: number}
        schedule:
          type: array
          description: One row per construction month `1..N`.
          items:
            $ref: "#/components/schemas/ConstructionInterestRow"
    ConstructionInterestRow:
      type: object
      additionalProperties: false
      required: [month, released_share, released_balance, interest]
      properties:
        month: {type: integer}
        released_share: {type: number, description: "`k/N`"}
        released_balance: {type: number, description: corrected balance × share}
        interest: {type: number, description: "released balance × `bank_pm`"}
    ClosingCosts:
      type: object
      additionalProperties: false
      required: [itbi, registry, total]
      properties:
        itbi: {type: number}
        registry: {type: number}
        total: {type: number}
    Financing:
      type: object
      description: SAC and PRICE side by side. Inside the schedules `month` counts from the start of financing (bank month 1 = timeline month N+1).
      additionalProperties: false
      required: [sac, price]
      properties:
        sac:
          $ref: "#/components/schemas/SacSchedule"
        price:
          $ref: "#/components/schemas/PriceSchedule"
    AmortizationSummary:
      type: object
      required: [first_installment, last_installment, total_interest, total_paid, min_income, schedule]
      properties:
        first_installment: {type: number}
        last_installment: {type: number}
        total_interest: {type: number}
        total_paid: {type: number}
        min_income: {type: number, description: "`first_installment / income_commitment_ratio`"}
        schedule:
          type: array
          description: One row per bank month `1..term_months`.
          items:
            $ref: "#/components/schemas/AmortizationRow"
    SacSchedule:
      allOf:
        - $ref: "#/components/schemas/AmortizationSummary"
        - type: object
          properties:
            amortization: {type: number, description: the constant amortization}
      required: [amortization]
      unevaluatedProperties: false
    PriceSchedule:
      allOf:
        - $ref: "#/components/schemas/AmortizationSummary"
        - type: object
          properties:
            installment: {type: number, description: the constant installment}
      required: [installment]
      unevaluatedProperties: false
    AmortizationRow:
      type: object
      additionalProperties: false
      required: [month, installment, interest, amortization, outstanding]
      properties:
        month: {type: integer}
        installment: {type: number}
        interest: {type: number}
        amortization: {type: number}
        outstanding: {type: number, description: balance after that payment}
    CreditGap:
      type: object
      description: The "Caixa trigger".
      additionalProperties: false
      required: [pre_approved, needed, gap, pro_soluto_months, pro_soluto_installment]
      properties:
        pre_approved: {type: number, description: "`pre_approved_credit`, or `mortgage.nominal_balance` when it was null"}
        needed: {type: number, description: "`mortgage.corrected_balance`"}
        gap: {type: number, description: "`max(0, needed − pre_approved)`"}
        pro_soluto_months: {type: integer}
        pro_soluto_installment: {type: number, description: "`gap / pro_soluto_months`, no interest"}
    TotalCost:
      type: object
      additionalProperties: false
      required: [list_price, additional, total, extra_pct, breakdown]
      properties:
        list_price: {type: number}
        additional: {type: number, description: everything paid on top of the list price until delivery}
        total: {type: number}
        extra_pct: {type: number, description: "`additional / list_price × 100`"}
        breakdown:
          type: array
          description: Four components and a closing `Total` row, in this order; `base_value` adds up to the list price.
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/BreakdownLine"
    BreakdownLine:
      type: object
      additionalProperties: false
      required: [component, base_value, additional, final_value]
      properties:
        component:
          type: string
          enum: [Down payment, Mortgage balance, Construction interest, Closing costs, Total]
          description: Stable identifiers, not translated labels.
        base_value: {type: number}
        additional: {type: number}
        final_value: {type: number, description: "`base_value + additional`"}
    Timeline:
      type: object
      description: Month-by-month cash out.
      additionalProperties: false
      required: [months, peak_month, peak_total, construction_phase_total]
      properties:
        months:
          type: array
          description: One row per month `0..N+term_months`.
          items:
            $ref: "#/components/schemas/TimelineRow"
        peak_month: {type: integer, description: "the construction-phase month (`0..N`) with the highest `total`"}
        peak_total: {type: number}
        construction_phase_total: {type: number, description: "sum of `total` over months `0..N`"}
    TimelineRow:
      type: object
      additionalProperties: false
      required: [month, developer_installment, balloon, construction_interest, bank_installment, upfront, total]
      properties:
        month: {type: integer, description: "0 = signing, 1..N construction, N+1.. bank installments"}
        developer_installment: {type: number}
        balloon: {type: number}
        construction_interest: {type: number}
        bank_installment: {type: number, description: the SAC installment}
        upfront: {type: number, description: non-zero only in month 0}
        total: {type: number, description: the sum of the other five}
