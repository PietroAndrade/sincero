// Experiment: could the model's validation rules (`backend/app/models/validators.py`, the
// contract's `422` table) live in the .proto and be enforced by the protobuf toolchain?
// A copy of three fields of `sincero.SimulationInput` with `buf.validate` rules — standard
// constraints and one CEL expression across fields.
//
// Required fields are `optional` + `(buf.validate.field).required = true` — explicit presence,
// so an absent field ("value is required") and an invalid one (the range rule) are two different
// violations. `optional` alone would skip the rules when the field is unset and let an absent
// field through. Decision: docs/decisions/required-fields-explicit-presence.md.
syntax = "proto3";
package sincero.rules;

import "buf/validate/validate.proto";

message ValidatedInput {
  option (buf.validate.message).cel = {
    id: "upfront_within_price"
    message: "upfront payments exceed the list price"
    // an absent list price is reported once, by `required`, not again as a price of 0
    expression: "!has(this.list_price) || this.fgts_upfront + this.cash_upfront <= this.list_price"
  };
  optional double list_price = 1 [(buf.validate.field).required = true, (buf.validate.field).double.gt = 0];
  optional int32 months_remaining = 2 [(buf.validate.field).required = true,
                                       (buf.validate.field).int32 = {gte: 1, lte: 600}];   // the 422 rule and the API ceiling, together
  optional double down_payment_pct = 3 [(buf.validate.field).double = {gte: 0, lte: 100}];
  optional double fgts_upfront = 4 [(buf.validate.field).double.gte = 0];
  optional double cash_upfront = 5 [(buf.validate.field).double.gte = 0];
  repeated int32 balloon_months = 6 [(buf.validate.field).repeated = {unique: true, max_items: 60, items: {int32: {gte: 1}}}];
}
